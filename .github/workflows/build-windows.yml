name: Build Windows executable

# - Commits pushed to main (without a version tag): build, test and replace the "Auto" pre-release
#   (tag "auto") with the executable of that commit. It is a pre-release, so the editor's updater,
#   which reads the latest stable release, does not offer it.
# - Version tags (git tag v1.2.0 && git push origin v1.2.0): publish that version as a release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One "Auto" release at a time: a newer commit replaces a build still running for an older one.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'auto-release' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must match package.json version (v$version)" }
      - name: Build executable
        run: bun run build
      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath release/MKWiiAdvancedEditor.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath release/MKWiiAdvancedEditor.exe.sha256 -Value "$hash  MKWiiAdvancedEditor.exe" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: MKWiiAdvancedEditor-windows-x64
          path: |
            release/MKWiiAdvancedEditor.exe
            release/MKWiiAdvancedEditor.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @("release/MKWiiAdvancedEditor.exe", "release/MKWiiAdvancedEditor.exe.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update $tag assets" }
            gh release edit $tag --title "MKWii Advanced Editor $tag"
          } else {
            gh release create $tag @assets --title "MKWii Advanced Editor $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $tag" }

      - name: Update the Auto release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}"
          $short = $sha.Substring(0, 7)
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $subject = (git log -1 --format=%s $sha)
          $notes = @"
          Automatic build of the latest commit on ``main``, replaced at every push. For tested versions, use the latest release with a version number.

          - Commit: [$short](${{ github.server_url }}/${{ github.repository }}/commit/$sha) $subject
          - Version in package.json: $version
          - Built: $((Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")) UTC
          "@
          # Remove the previous Auto release and its tag, then publish this commit under the same name.
          gh release delete auto --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous Auto release" }
          git push origin --delete auto 2>$null
          $global:LASTEXITCODE = 0
          gh release create auto release/MKWiiAdvancedEditor.exe release/MKWiiAdvancedEditor.exe.sha256 `
            --target $sha --prerelease --title "Auto ($short)" --notes $notes
